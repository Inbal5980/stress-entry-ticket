<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>כרטיס כניסה · שני כיוונים להתמודדות</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800&display=swap');
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Rubik,Arial,sans-serif;color:#22303a;min-height:100vh;background:#fff7ec;
background-image:radial-gradient(circle at 10% 10%,#ffd9a8 0 90px,transparent 91px),radial-gradient(circle at 95% 25%,#bfeee8 0 70px,transparent 71px),radial-gradient(circle at 85% 95%,#ffc9d9 0 110px,transparent 111px),radial-gradient(circle at 5% 80%,#fff0a8 0 60px,transparent 61px)}
.wrap{max-width:520px;margin:0 auto;padding:14px 14px 30px}
.top{display:flex;justify-content:space-between;align-items:center}
.top img{height:38px;background:#fff;border-radius:10px;padding:3px;box-shadow:0 2px 8px #0001}
.pill{background:#fff;border-radius:99px;padding:6px 14px;font-weight:800;color:#e0701b;box-shadow:0 2px 8px #0001}
.card{background:#fff;border-radius:26px;box-shadow:0 10px 30px #e0701b22;padding:20px 18px;margin-top:14px;position:relative;animation:pop .35s ease}
@keyframes pop{from{transform:translateY(12px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.hero{text-align:center}.hero img{width:190px;height:190px;object-fit:cover;border-radius:50%;border:6px solid #ffe2bf;margin-top:-4px}
h1{font-size:28px;margin:8px 0 2px;background:linear-gradient(90deg,#0f8f8c,#e0701b);-webkit-background-clip:text;color:transparent}
.lead{font-size:16px;line-height:1.6;color:#4a5963}
.chips{display:flex;gap:8px;justify-content:center;margin:12px 0}
.chip{border-radius:14px;padding:8px 12px;font-weight:600;font-size:14px}
.c1{background:#e3f6f3;color:#0f7c78}.c2{background:#ffe6ef;color:#c23d6d}
.dots{display:flex;gap:6px;justify-content:center;margin-top:12px}
.dots i{width:22px;height:8px;border-radius:9px;background:#f1e4d3}.dots i.on{background:#e0701b}.dots i.g{background:#2fb37a}.dots i.r{background:#ef6b5e}
.qe{font-size:46px;text-align:center;line-height:1}
.tag{display:block;text-align:center;font-size:13px;font-weight:600;color:#0f7c78;margin-top:6px}
.q{font-size:20px;font-weight:800;text-align:center;line-height:1.45;margin:10px 4px 16px}
.o{display:flex;align-items:center;gap:12px;width:100%;text-align:right;font:inherit;font-size:16.5px;font-weight:600;padding:14px;margin:10px 0;border:0;border-radius:18px;cursor:pointer;color:#22303a;transition:transform .12s}
.o:active{transform:scale(.97)}.o b{flex:none;width:34px;height:34px;border-radius:12px;display:grid;place-items:center;color:#fff;font-size:16px}
.k0{background:#fff1e0}.k0 b{background:#f08a24}.k1{background:#e3f6f3}.k1 b{background:#14a39e}.k2{background:#ffe9f0}.k2 b{background:#e2558a}.k3{background:#fff8d6}.k3 b{background:#e3b10f}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.t{border:0;border-radius:22px;padding:10px 8px 12px;font:inherit;font-weight:800;font-size:16px;cursor:pointer;color:#22303a;transition:transform .12s}
.t:active{transform:scale(.96)}.t img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:16px;display:block;margin-bottom:8px}
.tp{background:#e3f6f3}.te{background:#ffe9f0}
.ok{outline:4px solid #2fb37a;background:#e5f8ee!important}.no{outline:4px solid #ef6b5e;opacity:.8}
.dim{opacity:.45}
.why{margin-top:14px;padding:12px 14px;border-radius:16px;font-size:15.5px;line-height:1.5;animation:pop .3s}
.why.g{background:#e5f8ee}.why.r{background:#fff1e0}
.btn{display:block;width:100%;margin-top:16px;padding:15px;border:0;border-radius:18px;background:linear-gradient(90deg,#f08a24,#e2558a);color:#fff;font:inherit;font-size:18px;font-weight:800;cursor:pointer;box-shadow:0 6px 16px #e2558a44}
.big{font-size:64px;font-weight:800;text-align:center;background:linear-gradient(90deg,#0f8f8c,#e0701b);-webkit-background-clip:text;color:transparent;line-height:1.1}
.rev{font-size:14.5px;padding:9px 0;border-top:1px dashed #f0dcc4}.rev small{color:#6b7a84}
#cf{position:fixed;inset:0;pointer-events:none}
</style></head><body><canvas id="cf"></canvas><div class="wrap">
<div class="top"><img src="logo.png" alt=""><span class="pill" id="pill">🎟️ כרטיס כניסה</span></div>
<div id="app"></div></div>
<script>
const Q=[{"t": "mc", "e": "🛠️", "q": "מהי התמודדות ממוקדת בעיה?", "o": ["פעולה ישירה מול המצב", "שינוי הפרשנות שלנו למצב המלחיץ", "הסחת דעת בעזרת סדרה או משחק", "הרגעה עצמית בעזרת נשימות עמוקות"], "a": 0, "w": "ממוקדת בעיה = פועלים על המצב עצמו כדי לשנות אותו."}, {"t": "mc", "e": "💗", "q": "מהי התמודדות ממוקדת רגשות?", "o": ["שינוי הרגשות כלפי המצב", "תכנון צעדים לפתרון הבעיה", "פנייה לגורם שיכול לשנות את המצב", "איסוף מידע כדי להבין מה לעשות"], "a": 0, "w": "ממוקדת רגשות = משנים את התגובה הרגשית והמחשבות, המצב עצמו נשאר."}, {"t": "mc", "e": "🎛️", "q": "איזה מהמצבים הבאים הוא מצב שלא ניתן לשליטה?", "o": ["חברה קרובה עוברת עיר", "עבודה באנגלית שצריך להגיש ביום ראשון", "חדר מבולגן לפני שאורחים מגיעים", "חוסר הבנה של חומר במתמטיקה"], "a": 0, "w": "מעבר דירה של חברה הוא לא בשליטתנו, ולכן מתאימה בו התמודדות ממוקדת רגשות."}, {"t": "tf", "e": "✅", "q": "כשמצב ניתן לשליטה, בדרך כלל עדיף להתמודד בצורה ממוקדת בעיה.", "o": ["נכון", "לא נכון"], "a": 0, "w": "נכון! כשאפשר לשנות את המצב – כדאי לפעול עליו."}, {"t": "tf", "e": "🔄", "q": "התמודדות ממוקדת רגשות משנה את המצב המלחיץ עצמו.", "o": ["נכון", "לא נכון"], "a": 1, "w": "לא נכון. ממוקדת רגשות משנה את הרגשות והמחשבות שלנו, לא את המצב."}, {"t": "tf", "e": "🚪", "q": "גם עזיבה של מצב מלחיץ יכולה להיחשב התמודדות ממוקדת בעיה.", "o": ["נכון", "לא נכון"], "a": 0, "w": "נכון! יציאה מהמצב היא פעולה מול המצב עצמו."}, {"t": "pic", "e": "📉", "q": "מירב קיבלה ציון נמוך בעבודה, וקבעה פגישה עם המורה כדי להבין איך להשתפר. איזו התמודדות?", "o": ["ממוקדת בעיה", "ממוקדת רגשות"], "a": 0, "w": "מירב פועלת על הבעיה עצמה – משפרת את הציון."}, {"t": "pic", "e": "✈️", "q": "סבתא של מירב עברה לגור בחו\"ל. מירב מתגעגעת, ומסתכלת על תמונות משותפות כדי להרגיש קרובה. איזו התמודדות?", "o": ["ממוקדת בעיה", "ממוקדת רגשות"], "a": 1, "w": "מירב לא יכולה לשנות את המעבר, ולכן היא מטפלת ברגשות שלה."}, {"t": "pic", "e": "🚌", "q": "האוטובוס של מירב מאחר כמעט כל בוקר, אז היא מתחילה לצאת מהבית חצי שעה מוקדם יותר. איזו התמודדות?", "o": ["ממוקדת בעיה", "ממוקדת רגשות"], "a": 0, "w": "מירב משנה את המצב – מוצאת פתרון מעשי לאיחורים."}, {"t": "pic", "e": "🎭", "q": "מירב לא התקבלה למגמת התיאטרון. היא אומרת לעצמה: \"אולי זו הזדמנות לגלות תחום חדש\". איזו התמודדות?", "o": ["ממוקדת בעיה", "ממוקדת רגשות"], "a": 1, "w": "מירב משנה את הפרשנות שלה למה שקרה – התמודדות ממוקדת רגשות."}];
Q.forEach(x=>{if(x.t==='mc'){const c=x.o[x.a];for(let j=x.o.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[x.o[j],x.o[r]]=[x.o[r],x.o[j]];}x.a=x.o.indexOf(c);}});
let i=0,score=0,ans=[];const app=document.getElementById('app'),pill=document.getElementById('pill'),L='אבגד';
function dots(){return '<div class="dots">'+Q.map((_,k)=>`<i class="${k<ans.length?(ans[k]?'g':'r'):(k===i?'on':'')}"></i>`).join('')+'</div>';}
function start(){app.innerHTML=`<div class="card hero"><img src="maya.webp" alt="מירב"><h1>שני כיוונים להתמודדות</h1>
<p class="lead">מירב לחוצה 😬 איך אפשר להתמודד?<br>10 שאלות קצרות – בואו נבדוק מה זוכרים!</p>
<div class="chips"><span class="chip c1">🛠️ ממוקדת בעיה</span><span class="chip c2">💗 ממוקדת רגשות</span></div>
<p class="lead" style="font-size:14px">אפשר לפתור יחד עם השכן/ה ליד 🤝</p><button class="btn" id="go">יאללה, מתחילים 🚀</button></div>`;
document.getElementById('go').onclick=show;}
function show(){const x=Q[i];pill.textContent=`שאלה ${i+1} / ${Q.length}`;
let opts;if(x.t==='tf'){opts=`<div class="two"><button class="o k1" data-k="0" style="justify-content:center">✅ נכון</button><button class="o k2" data-k="1" style="justify-content:center">❌ לא נכון</button></div>`;}else if(x.t==='pic'){const P=x.o.indexOf('ממוקדת בעיה'),E=x.o.indexOf('ממוקדת רגשות');
opts=`<div class="two"><button class="t tp" data-k="${P}"><img src="prob.webp" alt="">🛠️ ממוקדת בעיה</button><button class="t te" data-k="${E}"><img src="emo.webp" alt="">💗 ממוקדת רגשות</button></div>`;}
else opts=x.o.map((t,k)=>`<button class="o k${k}" data-k="${k}"><b>${L[k]}</b><span>${t}</span></button>`).join('');
app.innerHTML=`<div class="card">${dots()}<div class="qe" style="margin-top:14px">${x.e}</div><span class="tag">${x.t==='mc'?'📖 ידע':x.t==='tf'?'⚖️ נכון / לא נכון':'🧩 מה מירב עושה?'}</span><div class="q">${x.q}</div>${opts}<div id="w"></div></div>`;
app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>pick(+b.dataset.k));}
function pick(k){const x=Q[i];const bs=[...app.querySelectorAll('[data-k]')];bs.forEach(b=>{b.disabled=true;const kk=+b.dataset.k;if(kk===x.a)b.classList.add('ok');else if(kk===k)b.classList.add('no');else b.classList.add('dim');});
const good=k===x.a;if(good){score++;burst(18);}ans.push(good);
document.getElementById('w').innerHTML=`<div class="why ${good?'g':'r'}">${good?'🎉 נכון!':'💡 כמעט!'} ${x.w}</div><button class="btn" id="nx">${i<Q.length-1?'לשאלה הבאה ⬅️':'לתוצאה שלי 🏆'}</button>`;
document.getElementById('nx').onclick=()=>{i++;i<Q.length?show():end();};}
function end(){pill.textContent='🏆 סיימת!';const msg=score>=9?'מעולה! את/ה מבינ/ה את ההבדל 🌟':score>=6?'יפה מאוד! עוד קצת חידוד 💪':'נחזור על זה יחד בשיעור 💛';
app.innerHTML=`<div class="card hero"><img src="${score>=6?'emo.webp':'prob.webp'}" alt=""><div class="big">${score}/${Q.length}</div><p class="lead" style="font-weight:600">${msg}</p>${dots()}<p class="lead" style="font-size:14px">אפשר להראות את המסך למורה ✋</p></div>
<div class="card">`+Q.map((x,k)=>`<div class="rev">${ans[k]?'✅':'❌'} ${x.e} ${x.q}<br><small>תשובה: ${x.o[x.a]}</small></div>`).join('')+`<button class="btn" onclick="location.reload()">שוב מההתחלה 🔁</button></div>`;
if(score>=6)burst(120);}
const cv=document.getElementById('cf'),cx=cv.getContext('2d');let P=[];
function rs(){cv.width=innerWidth;cv.height=innerHeight}rs();addEventListener('resize',rs);
function burst(n){const C=['#f08a24','#14a39e','#e2558a','#e3b10f','#2fb37a'];for(let k=0;k<n;k++)P.push({x:innerWidth/2,y:innerHeight*.45,vx:(Math.random()-.5)*12,vy:-Math.random()*12-4,c:C[k%5],s:5+Math.random()*6,l:90});if(P.length===n)tick();}
function tick(){cx.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.l--;cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.s,p.s*.6)});P=P.filter(p=>p.l>0&&p.y<cv.height+20);if(P.length)requestAnimationFrame(tick);else cx.clearRect(0,0,cv.width,cv.height);}
start();
</script></body></html>
